#--- Application Name ---
spring.application.name=api-gateway
spring.output.ansi.enabled=always

#--- Activate Docker profile ---
spring.profiles.active=docker

# --- Server ---
server.port=8080

# --- Eureka Client ---
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# --- Gateway Routes ---
# Member Service - credentials check (must come before security-service /api/auth/** catch-all)
spring.cloud.gateway.routes[0].id=member-auth
spring.cloud.gateway.routes[0].uri=http://member-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/checkCredentials

# Member Service - registration, profile, resources
spring.cloud.gateway.routes[1].id=member-service
spring.cloud.gateway.routes[1].uri=http://member-service:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/member/**,/api/register/**,/api/get/**,/api/verification/**,/api/profile/**

# Expedition Service
spring.cloud.gateway.routes[2].id=expedition-service
spring.cloud.gateway.routes[2].uri=http://expedition-service:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/expedition/**

# Payment Service
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=http://payment-service:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payment/**

# Security Service - session management
spring.cloud.gateway.routes[4].id=security-service
spring.cloud.gateway.routes[4].uri=http://security-service:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/**
